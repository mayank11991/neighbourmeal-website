<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bank details saved — NeighbourMeal</title>
  <style>
    body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f6f9fc;display:flex;
         justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);
          padding:32px;max-width:420px;text-align:center}
    .icon{font-size:56px}
    .badge{display:inline-block;background:#635bff;color:#fff;font-size:11px;font-weight:600;
           padding:4px 10px;border-radius:99px;letter-spacing:.5px}
    h1{font-size:20px;color:#1a1f36;margin:12px 0 8px}
    p{color:#697386;font-size:14px;line-height:1.5}
    .btn{display:inline-block;margin-top:18px;background:#2E7D32;color:#fff;text-decoration:none;
         font-size:15px;font-weight:600;padding:12px 28px;border-radius:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <span class="badge">STRIPE · ONBOARDED</span>
    <h1>Bank details saved</h1>
    <p>Your Stripe onboarding is complete. Return to the NeighbourMeal app — it will update automatically.</p>
    <a class="btn" href="neighbourmeal://stripe-onboarding-done">Open NeighbourMeal app</a>
  </div>
</body>
</html>
